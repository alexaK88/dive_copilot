services:
  - type: web
    name: voice-agent
    runtime: python
    plan: free
    buildCommand: 'true'
    startCommand: python deployment/browser/server.py
    envVars:
      # Render prompts for the AssemblyAI key during Blueprint creation.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Which agents/<name>.jsonc is loaded as the inline session template.
      # The browser deployment no longer publishes or looks up a stored agent,
      # so AGENT_ID is intentionally not used.
      - key: AGENT
        value: dive_copilot
